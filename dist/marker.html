<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>弓削丸 Web AR｜QRコード</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;text-align:center;color:#173f36;background:#f5f3e9;margin:28px 16px}main{max-width:800px;margin:auto}h1{font-size:clamp(24px,4vw,36px);margin:10px 0 22px}.qr{display:block;width:min(100%,680px);height:auto;margin:0 auto;background:#fff;image-rendering:pixelated}p{line-height:1.9}.steps{font-size:16px;margin:22px 0 12px}.note{font-size:12px;color:#61756b}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:24px 0}button,a{display:inline-block;padding:12px 18px;color:#173f36;font:inherit}button{cursor:pointer;border:1px solid #173f36;border-radius:24px;background:transparent}.brand{letter-spacing:.15em;font-size:11px}.print-tip{font-weight:600}
@page{size:A4 portrait;margin:12mm}
@media print{body{margin:0;background:white}main{max-width:none}h1{font-size:22px;margin:0 0 5mm}.brand{margin:0 0 3mm}.qr{width:170mm;max-width:100%;height:auto}.steps{font-size:12px;line-height:1.6;margin:5mm 0 3mm}.note{font-size:9px;line-height:1.5;margin:2mm 0}.actions,.screen-only{display:none}main{break-inside:avoid}}
</style></head>
<body><main><p class="brand">YUGEMARU / WEB AR</p><h1>このQRから、弓削丸に会おう。</h1>
<img class="qr" src="assets/qr-print.png" alt="弓削丸WebARを開き、モデルの配置にも使うQRコード" width="1480" height="1480">
<p class="steps">① スマートフォンでQRを読み取り、リンクを開く<br>② カメラ・端末の動きを許可する<br>③ 同じQR全体を映すと、弓削丸が配置されます</p>
<p class="note screen-only">QRが見えている間は、その位置に追従します。<br>見失うと最後の位置に残り、再び映すと再配置します。<br>初期横幅は約2m。ピンチで拡大縮小、スワイプで回転できます。</p>
<p class="note print-tip">白い余白も残して印刷し、明るい場所で平らに置いてください。</p>
<p class="note">現在は所有者限定の試作版です。閲覧には所有者のログインが必要です。</p>
<div class="actions"><button onclick="window.print()">QRコードを大きく印刷</button><a href="assets/qr-print.png" download="yugemaru-ar-qr.png">大きいQR画像を保存</a><a href="./">ARを開く</a><a href="model.html">3Dモデルを見る</a></div></main></body></html>
