<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ゆげまる Web AR｜QRコード</title><style>body{font-family:system-ui,sans-serif;text-align:center;color:#173f36;background:#f5f3e9;margin:36px 20px}main{max-width:600px;margin:auto}img{width:min(85vw,360px);background:white}p{line-height:1.9}button,a{display:inline-block;padding:12px 18px;margin:8px;color:#173f36}button{cursor:pointer;border:1px solid #173f36;border-radius:24px;background:transparent}.note{font-size:12px;color:#61756b}@media print{.actions{display:none}img{width:90mm}body{margin:12mm;background:white}h1{font-size:24px}}</style></head><body><main><p class="note">YUGEMARU / WEB AR</p><h1>このQRから、ゆげまるに会おう。</h1><img src="assets/qr.png" alt="WebARページへのリンクと、初期配置の目印を兼ねるQRコード"><p>① スマートフォンでQRを読み取り、リンクを開く<br>② カメラ・端末の動きを許可する<br>③ 同じQR全体を映すと、ゆげまるが配置されます</p><p>QRが見えている間は、その位置に追従します。<br>見失うと最後の位置に残り、再び映すと再配置します。<br>初期横幅は約2m。ピンチで大きさを変えられます。</p><p class="note">白い余白を残して印刷し、明るい場所で平らに置いてください。<br>現在は所有者限定の試作版です。閲覧には所有者のログインが必要です。</p><div class="actions"><button onclick="window.print()">QRコードを印刷</button><a href="assets/qr.png" download="yugemaru-ar-qr.png">QR画像を保存</a><a href="./">ARを開く</a><a href="model.html">3Dモデルを見る</a></div></main></body></html>
