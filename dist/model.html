<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ゆげまる 3D確認</title><script src="vendor/aframe.min.js"></script><script>AFRAME.registerComponent('preview-model',{init(){this.el.addEventListener('model-loaded',()=>{const m=this.el.getObject3D('mesh'),parent=m.parent;parent.remove(m);m.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(m),d=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),s=2/Math.max(d.x,d.y,d.z);parent.add(m);m.scale.multiplyScalar(s);m.position.set(-c.x*s,-c.y*s,-c.z*s);document.querySelector('#state').textContent='3Dモデルを読み込みました';});this.el.addEventListener('model-error',()=>document.querySelector('#state').textContent='モデルの読み込みに失敗しました');}});</script><style>body{margin:0;font-family:system-ui}nav{position:fixed;z-index:10;padding:20px;color:#173f36}a{color:inherit}</style></head><body><nav><a href="./">← 戻る</a><p id="state" role="status">モデルを読み込み中…</p></nav><a-scene background="color: #e2ecb8" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false"><a-entity preview-model gltf-model="url(assets/yugemaru.glb)" position="0 1.5 -3"></a-entity><a-entity light="type: ambient; intensity: 1.5"></a-entity><a-entity light="type: directional; intensity: 2" position="1 3 2"></a-entity><a-camera position="0 1.5 0" wasd-controls="enabled:false" look-controls="enabled:false"></a-camera></a-scene></body></html>
