name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified site build
        shell: bash
        run: |
          mkdir -p _site
          while IFS= read -r path; do
            mkdir -p "_site/$(dirname "$path")"
            curl --fail --silent --show-error --retry 3 "https://yugemaru-ar.inaphy-ai.chatgpt.site/$path" -o "_site/$path"
          done < site-files.txt
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
